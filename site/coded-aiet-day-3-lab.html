<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 3 Lab &middot; AI Essentials in the Workplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00081C;--bg2:#000C22;--surface:#00112F;--surface2:#14243F;--raise:#1B3055;
  --line:#152A4A;--line2:#223D63;--line3:#31527F;
  --primary:#2F74D6;--deepblue:#004AA3;--soft:#6F9CE8;--light:#A8C6F2;--indigo:#3E50DD;
  --green:#3DC873;--green-lt:#8FE6AE;--gold:#E9C46A;--gold-lt:#FFE9B3;--danger:#FF5A6E;
  --ink:#F2F6FC;--ink2:#DCE6F5;--dim:#9FB2D4;--faint:#6F83A8;--ghost:#4D6188;
  --ink-faint:#6F83A8;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:22px;
  --rail-w:290px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:16px;
  background-image:radial-gradient(70% 55% at 100% 0%,rgba(0,74,163,.20),transparent 62%),
                   radial-gradient(60% 50% at 0% 100%,rgba(62,80,221,.10),transparent 60%);
  background-attachment:fixed}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(47,116,214,.34)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}
#rail{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg2),#00060F);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.rail-top{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--deepblue));
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none;font-family:var(--mono)}
.brand .bt{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);line-height:1.3}
.brand .bt b{color:var(--soft);display:block;font-size:12.5px;letter-spacing:.1em}
.daychip{margin-top:15px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:99px;padding:6px 12px}
.daychip .d{width:7px;height:7px;border-radius:99px;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.prog{margin-top:16px}
.prog .pl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:7px}
.prog .pl b{color:var(--ink);font-size:13px}
.prog .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.prog .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--deepblue),var(--soft));transition:width .6s cubic-bezier(.2,.8,.2,1)}
#navList{flex:1;overflow-y:auto;padding:12px 12px 8px}
.nav-sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ghost);padding:13px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;border:1px solid transparent;
  background:none;color:inherit;padding:11px 12px;border-radius:var(--r);margin-bottom:4px;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
.nav-item.active{background:rgba(47,116,214,.14);border-color:rgba(47,116,214,.45)}
.nav-item .ni-n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);width:26px;height:26px;
  border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;background:rgba(0,0,0,.25)}
.nav-item.active .ni-n{color:var(--soft);border-color:rgba(47,116,214,.55)}
.nav-item.done .ni-n{color:#04220f;background:var(--green);border-color:var(--green)}
.nav-item .ni-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.3}
.nav-item.active .ni-t{color:var(--ink)}
.rail-foot{padding:12px;border-top:1px solid var(--line)}
.rfbtn{width:100%;font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--line2);
  background:rgba(0,0,0,.25);color:var(--dim);border-radius:var(--r-sm);padding:9px 10px;transition:all .15s}
.rfbtn:hover{color:var(--ink);border-color:var(--line3)}

#main{min-width:0;display:flex;flex-direction:column}
#mtop{position:sticky;top:0;z-index:30;background:rgba(0,8,28,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.backlink{font-weight:600;font-size:13px;color:var(--dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line2);border-radius:8px;padding:7px 12px;transition:all .15s}
.backlink:hover{color:var(--ink);border-color:var(--line3)}
.ham{display:none;background:none;border:1px solid var(--line2);color:var(--dim);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px}
#crumb{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.mtop-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.navbtn{background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--dim);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-size:14px;transition:all .15s}
.navbtn:hover:not(:disabled){color:var(--ink);border-color:var(--line3)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}

#view{padding:34px 26px 90px;max-width:900px;width:100%;margin:0 auto}
.task-tag{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.task-tag .app{color:var(--soft);background:rgba(47,116,214,.14);border:1px solid rgba(47,116,214,.34);
  border-radius:99px;padding:5px 12px;font-weight:600}
.task-tag .mins{color:var(--ghost)}
.task-h{font-size:clamp(26px,3.6vw,38px);font-weight:700;letter-spacing:-1.1px;line-height:1.14;margin-bottom:14px}
.scn{font-size:16.5px;color:var(--dim);line-height:1.6;margin-bottom:24px;max-width:780px}

.step-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:0 var(--r-lg) var(--r-lg) 0;padding:20px 24px;margin-bottom:20px}
.sc-k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:13px}
.step-card ol{list-style:none;counter-reset:sx;display:flex;flex-direction:column;gap:11px}
.step-card ol li{counter-increment:sx;display:flex;gap:13px;font-size:15.5px;color:var(--ink2);line-height:1.5}
.step-card ol li::before{content:counter(sx);font-family:var(--mono);font-size:10.5px;font-weight:600;
  width:23px;height:23px;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid var(--line2);
  color:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.step-card ol li b{color:var(--ink)}

.prompt{position:relative;background:rgba(0,0,0,.34);border:1px solid var(--line2);border-radius:var(--r);
  padding:15px 17px 15px;margin-top:13px;font-size:14.5px;color:var(--ink2);line-height:1.55;cursor:pointer;transition:all .15s}
.prompt:hover{border-color:var(--line3);background:rgba(0,0,0,.5)}
.prompt.copied{border-color:var(--green);background:rgba(61,200,115,.08)}
.copy-tag{position:absolute;top:-9px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);background:var(--bg);border:1px solid var(--line2);border-radius:20px;padding:3px 9px}
.prompt.copied .copy-tag{color:var(--green-lt);border-color:var(--green)}
.lw-starters{display:flex;flex-direction:column;gap:4px}

.lw-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lw-tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--dim);background:rgba(0,0,0,.28);
  border:1px solid var(--line2);border-radius:99px;padding:8px 15px;cursor:pointer;transition:all .15s}
.lw-tab:hover{color:var(--ink);border-color:var(--line3)}
.lw-tab.on{background:rgba(47,116,214,.2);border-color:var(--primary);color:#fff}
.lw-job{font-size:15px;color:var(--ink2);margin-bottom:13px;line-height:1.5}
.lw-job b{color:var(--soft)}
.lw-pre{background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;
  font-family:var(--mono);font-size:12.5px;line-height:1.72;color:var(--ink2);white-space:pre-wrap;
  overflow-x:auto;max-height:340px;overflow-y:auto;transition:all .15s}
.lw-pre.copyable{cursor:pointer}
.lw-pre.copyable:hover{border-color:var(--line3)}
.lw-pre.copied{border-color:var(--green)}
.lw-fields{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.lw-fields input{background:var(--bg);border:1.5px solid var(--line2);color:var(--ink);border-radius:var(--r);
  padding:13px 15px;font-family:var(--sans);font-size:14.5px}
.lw-fields input:focus{outline:none;border-color:var(--primary)}
.lw-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lw-btn{background:linear-gradient(135deg,var(--primary),var(--deepblue));color:#fff;border:none;border-radius:var(--r);
  padding:12px 20px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .16s}
.lw-btn:hover{transform:translateY(-2px)}
.lw-btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim)}
.lw-btn.ghost:hover{color:var(--ink);border-color:var(--line3);transform:none}
.lw-hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
.lw-out{background:rgba(0,0,0,.4);border:1px solid var(--line2);color:var(--ink2);border-radius:var(--r);
  padding:15px 17px;font-family:var(--mono);font-size:13px;line-height:1.6;min-height:100px;resize:vertical;margin-top:4px;width:100%}
.lw-test{display:inline-flex;align-items:center;gap:8px;background:rgba(47,116,214,.16);
  border:1px solid rgba(47,116,214,.45);color:var(--light);border-radius:var(--r);padding:12px 18px;
  font-size:14px;font-weight:600;transition:all .15s}
.lw-test:hover{background:rgba(47,116,214,.28);color:#fff}

.qi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:12px;transition:border-color .2s}
.qi.right{border-color:rgba(61,200,115,.45);background:rgba(61,200,115,.06)}
.qi.wrong{border-color:rgba(255,90,110,.45);background:rgba(255,90,110,.05)}
.qi .qt{font-size:16px;line-height:1.55;color:var(--ink);margin-bottom:15px}
.qi .qopts{display:flex;gap:8px;flex-wrap:wrap}
.qopt{font-size:13.5px;font-weight:600;color:var(--dim);background:rgba(0,0,0,.28);border:1px solid var(--line2);
  border-radius:99px;padding:8px 16px;cursor:pointer;transition:all .15s}
.qopt:hover{color:var(--ink);border-color:var(--line3)}
.qopt.sel{background:rgba(47,116,214,.2);border-color:var(--primary);color:#fff}
.qopt.ok{background:rgba(61,200,115,.18);border-color:var(--green);color:var(--green-lt)}
.qopt.no{background:rgba(255,90,110,.15);border-color:var(--danger);color:#FFC2CA}
.qwhy{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px;color:var(--dim);line-height:1.55}
.qwhy.show{display:block}
.qwhy b{color:var(--ink2)}
.verdict{margin-top:14px;font-size:15px;font-weight:600;display:none}
.verdict.show{display:block}
.verdict.bad{color:var(--danger)}
.verdict.good{color:var(--green-lt)}

.expect{background:linear-gradient(135deg,rgba(0,74,163,.2),rgba(0,74,163,.03));
  border:1px solid rgba(47,116,214,.36);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:20px}
.ex-k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:10px}
.expect p{font-size:15.5px;color:var(--ink2);line-height:1.55}

.capture{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 24px;margin-top:24px}
.capture label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin-bottom:12px}
.capture textarea{width:100%;background:var(--bg);border:1.5px solid var(--line2);color:var(--ink);
  border-radius:var(--r);padding:14px 16px;font-family:var(--sans);font-size:15px;line-height:1.55;min-height:110px;resize:vertical}
.capture textarea:focus{outline:none;border-color:var(--primary)}
.cap-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.cap-btn{background:linear-gradient(135deg,var(--primary),var(--deepblue));color:#fff;border:none;
  border-radius:var(--r);padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .16s}
.cap-btn:hover{transform:translateY(-2px)}
.cap-done{font-family:var(--mono);font-size:12px;color:var(--green-lt);opacity:0;transition:opacity .2s}
.cap-done.on{opacity:1}

.task-foot{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.tf-btn{background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--dim);border-radius:var(--r);
  padding:13px 22px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .15s}
.tf-btn:hover:not(:disabled){color:var(--ink);border-color:var(--line3)}
.tf-btn:disabled{opacity:.32;cursor:not-allowed}
.tf-btn.next{background:linear-gradient(135deg,var(--primary),var(--deepblue));color:#fff;border-color:transparent}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;width:var(--rail-w);transform:translateX(-100%);transition:transform .25s}
  #rail.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .ham{display:block}
  #view{padding:26px 18px 80px}
}

/* ---------- dataset / file blocks ---------- */
.dataset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:20px}
.ds-k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:11px}
.ds-note{font-size:14.5px;color:var(--dim);line-height:1.55;margin-bottom:14px}
.dl{display:inline-flex;align-items:center;gap:12px;background:rgba(47,116,214,.16);border:1px solid rgba(47,116,214,.45);
  color:var(--light);border-radius:var(--r);padding:12px 18px;font-size:14.5px;font-weight:600;transition:all .15s;margin-bottom:4px}
.dl:hover{background:rgba(47,116,214,.28);color:#fff}
.dl .ic{font-size:15px}
.dl small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);margin-top:3px}
.ds-table-wrap{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.ds-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.ds-table th{background:rgba(0,0,0,.34);color:var(--soft);text-align:left;padding:10px 13px;font-weight:600;
  border-bottom:1px solid var(--line2);letter-spacing:.04em}
.ds-table td{padding:9px 13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.ds-table tr:last-child td{border-bottom:none}
.ds-more{padding:10px 13px;font-family:var(--mono);font-size:11px;color:var(--ghost)}

/* ---------- launches ---------- */
.launches{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.launch{flex:1;min-width:230px;display:flex;flex-direction:column;gap:6px;background:rgba(47,116,214,.12);
  border:1px solid rgba(47,116,214,.4);border-radius:var(--r-lg);padding:16px 18px;transition:all .15s}
.launch:hover{background:rgba(47,116,214,.22)}
.launch .ln{font-size:15.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.launch .lnn{font-size:13px;color:var(--dim);line-height:1.45}

/* ---------- goal ---------- */
.goal{background:linear-gradient(135deg,rgba(233,196,106,.13),rgba(233,196,106,.02));
  border:1px solid rgba(233,196,106,.34);border-left:3px solid var(--gold);
  border-radius:0 var(--r-lg) var(--r-lg) 0;padding:18px 22px;margin-bottom:20px}
.goal .gk{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-lt);font-weight:600;margin-bottom:9px}
.goal p{font-size:15.5px;color:var(--ink2);line-height:1.55}

/* ---------- prompt steps ---------- */
.pstep{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:0 var(--r-lg) var(--r-lg) 0;padding:20px 24px;margin-bottom:16px}
.pstep .psk{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:11px}
.pstep .psg{font-size:15px;color:var(--ink2);line-height:1.55}

/* ---------- capstone idea accordion ---------- */
.idea{border:1px solid var(--line2);border-radius:var(--r);margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.24)}
.idea[open]{border-color:var(--line3);background:rgba(0,0,0,.34)}
.idea summary{cursor:pointer;padding:15px 18px;font-size:15.5px;font-weight:600;color:var(--ink2);
  list-style:none;display:flex;align-items:center;gap:11px;transition:color .15s}
.idea summary::-webkit-details-marker{display:none}
.idea summary::before{content:'+';font-family:var(--mono);font-size:15px;color:var(--soft);width:18px;flex:none}
.idea[open] summary::before{content:'\2212'}
.idea summary:hover{color:var(--ink)}
.idea summary .dept{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ghost);font-weight:400}
.idea .body{padding:2px 20px 18px 47px}
.idea .body p{font-size:14.5px;line-height:1.62;margin:12px 0;color:var(--dim)}
.idea .body p b{color:var(--ink2)}
.idea .body p.warn{color:var(--gold-lt)}
.idea .body p.warn b{color:var(--gold)}
.idea .body .dl{margin-top:6px}

/* ---------- findings ---------- */
.findings{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.find{display:flex;flex-direction:column;gap:6px}
.find > span{font-size:13.5px;color:var(--dim);font-weight:600}
.find-in{background:var(--bg);border:1.5px solid var(--line2);color:var(--ink);border-radius:var(--r);
  padding:12px 15px;font-family:var(--sans);font-size:14.5px;width:100%}
.find-in:focus{outline:none;border-color:var(--primary)}
.find-in.filled{border-color:rgba(61,200,115,.5);background:rgba(61,200,115,.05)}
.find-in::placeholder{color:var(--ghost);font-style:italic}
</style>
</head>
<body>
<div id="app">
<aside id="rail">
  <div class="rail-top">
    <div class="brand"><span class="mark">AI</span>
      <span class="bt">AI Essentials<b>Day 3 Lab</b></span></div>
    <div class="daychip"><span class="d"></span> Day 3 &middot; Features and capstone</div>
    <div class="prog"><div class="pl"><span id="progLabel">0 of 7 done</span></div>
      <div class="bar"><div class="fill" id="progFill"></div></div></div>
  </div>
  <div id="navList"></div>
  <div class="rail-foot"><button class="rfbtn" id="resetBtn">&#8634; Reset my notes</button></div>
</aside>
<main id="main">

<script>const TASKS=[{"app": "Claude", "sec": "S1 &middot; Connectors and Skills", "mins": "~15 min", "title": "D3.1 &middot; Connect something real", "scenario": "Two days of pasting. Now stop. Turn on one connector, ask a question that only works because of it, then turn it off again and watch the answer change.", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "Connector settings live in your account settings."}], "goal": "One working connector, one answer you could not have got without it, and the confidence to explain to your IT team exactly what it does and how to revoke it.", "steps": ["Open the connector settings and <b>read what one actually asks for</b> before you enable anything.", "Turn on a connector you are permitted to use.", "Ask a question that only works because of the connection.", "Revoke it, ask the same question again, and note what changed."], "promptSteps": [{"label": "If your organization blocks connectors", "goal": "Plenty of companies do, and that is a reasonable position. Do this instead and you get the same lesson without needing permission.", "prompt": "I want to understand what a connector would change for me. Here is a task I do weekly: [DESCRIBE IT]. Walk me through exactly what a connector to [TOOL] would read, what it would not read, what it would let me stop doing by hand, and what I would need to tell my IT team to get it approved. Be specific about the risks, not reassuring."}, {"label": "The question to take to IT", "goal": "Turn what you just learned into something your IT team can actually answer, rather than a request they have to refuse.", "prompt": "Draft the message I would send to my IT or security team asking about connector access. Say what I want to connect, what business task it serves, what data it would touch, and what controls I am asking them to confirm. Short, specific, and easy to say yes or no to."}], "findings": [{"label": "What did you connect?", "hint": "or, what would you connect first"}, {"label": "The question that only worked with it", "hint": "one line"}, {"label": "What changed when you revoked it?", "hint": "be specific"}], "expect": "A connector you have turned on and off yourself, or a specific, sendable request to your IT team. Either one means you understand what you are asking for.", "stretch": "Ask Claude what it can see through the connector that you did not expect. The answer is occasionally uncomfortable, and always worth knowing.", "boss": "Write the one paragraph a security reviewer would send back rejecting your request. Then rewrite the request so it survives that paragraph."}, {"app": "In pairs", "sec": "Capstone &middot; Phase 0", "mins": "~10 min", "title": "D3.2 &middot; Phase 0. Pick your idea", "scenario": "Ten minutes, no tools open. Pair up, read two ideas, pick one, download your data, and agree who does what. For every deliverable one of you builds, the other verifies.", "widget": "<div class=\"ds-note\" style=\"margin-bottom:14px\">Read two. Pick one. Commit before you open a single tool.</div><details class=\"idea\"><summary>01 &middot; The Overtime Decision<span class=\"dept\">Operations</span></summary><div class=\"body\"><p><b>The situation.</b> Overtime has been climbing for nine months while headcount falls. Two vacancies have been open since April and were never filled. One team is running noticeably higher absence than every other.</p><p><b>Your initiative.</b> A staffing decision you can defend in a budget meeting: hire, or keep paying overtime. Say which team, how many people, and what it costs or saves in year one.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"ops-overtime-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>ops-overtime-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Nine months of overtime by team and month: hours, cost, headcount, absence per person, open vacancies.</div><a class=\"dl\" href=\"ops-hiring-costs-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>ops-hiring-costs-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Salary, recruitment cost, onboarding weeks, standard hours and the overtime rate for each role.</div><p class=\"warn\"><b>Watch out.</b> One row is obviously impossible. Do not just delete it. The cost cell on that row is correct, so the real number can be recovered.</p></div></details><details class=\"idea\"><summary>02 &middot; The Retention Programme<span class=\"dept\">Human Resources</span></summary><div class=\"body\"><p><b>The situation.</b> 146 people left over eighteen months. Leadership believes the problem is the biggest department and that people leave for money. Neither belief has been tested against the data.</p><p><b>Your initiative.</b> A targeted retention programme: which department the budget goes to, what the actual leaving reason is, and two interventions with an owner each.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"hr-leavers-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>hr-leavers-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Eighteen months of leavers: department, hire and leave dates, tenure band, reason, voluntary, exit interview done.</div><a class=\"dl\" href=\"hr-headcount-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>hr-headcount-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Average headcount and number of locations per department, same period.</div><p class=\"warn\"><b>Watch out.</b> The department with the most leavers is not the department with the problem. You need both files to prove that.</p></div></details><details class=\"idea\"><summary>03 &middot; The Channel Rescue<span class=\"dept\">Customer Service</span></summary><div class=\"body\"><p><b>The situation.</b> 564 tickets across five channels in six months. One channel breaches its target on almost every ticket and yet has the happiest customers in the business. Another is quietly collapsing.</p><p><b>Your initiative.</b> A channel rescue plan: name the channel that is genuinely failing, say why, and propose a staffing or target change with the numbers behind it.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"cs-tickets-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>cs-tickets-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Six months of tickets: channel, date, hour, request type, first response hours, resolved first contact, satisfaction.</div><a class=\"dl\" href=\"cs-staffing-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>cs-staffing-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Agents assigned, hours covered and the response target for each channel.</div><p class=\"warn\"><b>Watch out.</b> A high breach rate is not proof of failure. Before you accuse a channel, check whether its target was ever realistic.</p></div></details><details class=\"idea\"><summary>04 &middot; The Supplier Consolidation<span class=\"dept\">Procurement</span></summary><div class=\"body\"><p><b>The situation.</b> 193 purchase orders across five categories and a long tail of suppliers. Spend is concentrated in one category, and one supplier delivers late far more often than the rest.</p><p><b>Your initiative.</b> A consolidation recommendation: which category to address first, which supplier relationships to keep or exit, and what the change is worth.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"procurement-purchase-orders-2026.xlsx\" download><span class=\"ic\">&#11015;</span><span>Download<small>procurement-purchase-orders-2026.xlsx</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">A year of purchase orders: date, category, supplier, value, delivery days, on time, requested by.</div><a class=\"dl\" href=\"procurement-purchase-orders-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>procurement-purchase-orders-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">The same rows as plain text, if you would rather paste than upload.</div><p class=\"warn\"><b>Watch out.</b> Count your suppliers before you rank them. At least one appears under more than one spelling, and it changes the ranking.</p></div></details><details class=\"idea\"><summary>05 &middot; The Recognition Programme<span class=\"dept\">People</span></summary><div class=\"body\"><p><b>The situation.</b> 161 staff responded to the engagement survey. One department scores far below every other, and one question scores worst across the whole company. The file itself is not clean.</p><p><b>Your initiative.</b> A 90 day recognition programme: two actions aimed at the weakest score, an owner for each, and a pulse survey to prove movement.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"employee-satisfaction-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>employee-satisfaction-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">161 survey responses. Six questions scored 1 to 5, an overall score, and free text comments.</div><p class=\"warn\"><b>Watch out.</b> The department that looks best has three responses in it. Say what the data supports, and admit what it cannot.</p></div></details><details class=\"idea\"><summary>06 &middot; The Cost Control Programme<span class=\"dept\">Finance</span></summary><div class=\"body\"><p><b>The situation.</b> The year to date position is over budget, and the Summary sheet does not agree with the detail behind it. Three defensible answers exist to the question of how far over.</p><p><b>Your initiative.</b> A cost control programme for the next quarter: three concrete measures, each tied to a budget line, plus a monthly variance review so overruns surface in weeks.</p><p><b>Your data.</b></p><a class=\"dl\" href=\"department-budget-2026.xlsx\" download><span class=\"ic\">&#11015;</span><span>Download<small>department-budget-2026.xlsx</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">Two sheets: 32 detail lines with budget against actual, and a department Summary.</div><a class=\"dl\" href=\"department-budget-2026.csv\" download><span class=\"ic\">&#11015;</span><span>Download<small>department-budget-2026.csv</small></span></a><div class=\"ds-note\" style=\"margin:4px 0 12px\">The same detail lines as plain text.</div><p class=\"warn\"><b>Watch out.</b> Every saving you promise must trace to a line in the workbook. A saving with no line behind it is a wish.</p></div></details><details class=\"idea\"><summary>07 &middot; Your Own Work<span class=\"dept\">Bring your own</span></summary><div class=\"body\"><p><b>The situation.</b> A decision from your own department, using your own data. Better than any of ours, if it clears the gate.</p><p><b>Your initiative.</b> The same four deliverables, on your own redacted material. The instructor signs it off before you start.</p><p class=\"warn\"><b>Watch out.</b> Four questions first, and all four must be yes. Can you name the decision somebody has to make? Do you have the data in a file today? Have you redacted every name, ID, salary and contract reference? Would you be comfortable if this file appeared on a screen in this room? Anything less than four, take one of ours.</p></div></details>", "widgetFirst": true, "widgetLabel": "Seven ideas. Pick one.", "goal": "An idea you both understand, the data open on one screen, and a role split written down. Nothing built yet, which is the whole point of Phase 0.", "steps": ["Pair up. Somebody who does not do your job makes a better partner.", "Read two ideas above together. Pick one and <b>commit</b>. Do not shop around.", "Download your data and open it once, together, before anything else.", "Write down who <b>builds</b> and who <b>verifies</b> for each of the four deliverables."], "findings": [{"label": "Your idea", "hint": "the number and the name"}, {"label": "Who builds, who verifies", "hint": "deliverable by deliverable"}, {"label": "Your one sentence recommendation, before any analysis", "hint": "you will check this at the end"}], "expect": "One idea, both of you clear on it, data downloaded, and a role split you have actually written down.", "stretch": "Write the one sentence version of your recommendation now, before the data. At the end, check whether the data changed your mind. If it did not, be suspicious of yourself.", "boss": "Name the single number in your data most likely to sink the initiative if it turns out to be wrong. That is the first thing the verifier checks."}, {"app": "Claude", "sec": "Capstone &middot; D1", "mins": "~40 min", "title": "D3.3 &middot; Deliverable 1. Executive briefing", "scenario": "One page a director reads in ninety seconds: the decision, the evidence, the recommendation, the risk. You write the prompt from your idea, using everything from the last two days.", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "One conversation for the whole capstone. Keep it open."}], "goal": "A one page briefing where the recommendation leads, every figure traces to your file, and the risk is named before anyone asks for it.", "steps": ["Attach your data to one new Claude conversation and keep it for the whole capstone.", "Profile the files before you analyse them. You know how by now.", "Answer the question your idea asks. With numbers, and with the working shown.", "Then write the briefing. The verifier checks every figure against the file."], "promptSteps": [{"label": "Step 1 &middot; Profile, then answer", "goal": "Find what is wrong with the files before you let them tell you anything, then answer the actual question.", "prompt": "Before analysing anything, profile the attached files. Report row counts, exact duplicate rows, blank cells by column, any value impossible for its column, and any category spelled more than one way. Give me row identifiers. Then answer this question using the cleaned data, showing every calculation step by step: [YOUR IDEA'S QUESTION]. Where you assume something, say so on its own line.", "findings": [{"label": "Problems you found in the data", "hint": "how many, and the worst one"}, {"label": "Your answer, in one sentence", "hint": "the decision, not a description"}, {"label": "The number behind it", "hint": "and what it is a number of"}]}, {"label": "Step 2 &middot; Argue against yourself", "goal": "Every idea here has a trap that survives one question. Find yours before the room does.", "prompt": "Now argue against my conclusion. What in this data looks like a problem but is not? What looks fine but is not? Is there anything true here that my recommendation would hide from the reader? Give me the strongest case against what I just concluded.", "findings": [{"label": "The trap in your data", "hint": "what looks like the answer and is not"}, {"label": "Did it change your recommendation?", "hint": "yes, no, or how"}]}, {"label": "Step 3 &middot; The briefing", "goal": "One page. Decision at the top, three numbers, a recommendation with a cost, and the risk that would make you wrong.", "prompt": "Write a one page executive briefing from our analysis. Structure: the decision being asked for in one sentence at the top, then the evidence in three numbers maximum with the file each came from, then the recommendation with what it costs or saves, then the risk that would make this wrong. Direct and factual. Do not use a number we have not verified together.", "findings": [{"label": "The decision, in one sentence", "hint": "as it appears at the top"}, {"label": "The risk you named", "hint": "what would make you wrong"}, {"label": "Verifier: which figure did you check?", "hint": "and did it hold up"}]}], "expect": "A one page briefing where the recommendation leads and every figure traces to your data. Ninety seconds to read, nothing wasted.", "stretch": "Ask Claude to attack it. “What would a sceptical finance director push back on in this briefing?” Fix the two best objections.", "boss": "Write the 60 word version, for the executive who will not read even one page. Same recommendation, nothing lost that matters."}, {"app": "Claude Design or Gamma", "sec": "Capstone &middot; D2", "mins": "~35 min", "title": "D3.4 &middot; Deliverable 2. Stakeholder deck", "scenario": "Five or six slides that carry your briefing into a room. You compared the two tools yesterday. Now pick the one that fits this job and build it.", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "Same conversation. It already has your analysis and your briefing."}, {"label": "Open Gamma", "href": "https://gamma.app", "note": "If you preferred Gamma yesterday, build it here."}], "goal": "A five or six slide deck that tells the same story as the briefing, with every number checked by the person who did not build it.", "steps": ["Choose your tool. One sentence on why, in the findings box.", "Five or six slides: the decision, the situation, the evidence, the recommendation, the plan.", "Every headline eight words or fewer. Every figure carries its source.", "The verifier opens two slides and checks them against the data."], "promptSteps": [{"label": "The deck prompt", "goal": "The briefing turned into slides, without the story drifting on the way.", "prompt": "Turn that briefing into a six slide stakeholder deck. Slide 1 the decision as a headline. Slide 2 the situation in three numbers. Slide 3 the evidence with the claim written in the caption. Slide 4 the second finding, the one that complicates the obvious answer. Slide 5 the recommendation and its cost. Slide 6 the risk and what we would do about it. Eight words or fewer per headline. Every figure carries its source.", "findings": [{"label": "Which tool, and why", "hint": "one sentence"}, {"label": "A figure the verifier checked on a slide", "hint": "and whether it held"}]}], "expect": "A five or six slide deck that tells the same story as the briefing. If the deck and the briefing disagree anywhere, one of them is wrong and you need to know which.", "stretch": "Regenerate your evidence slide for a different audience, the front line team rather than the director. Notice what has to change, and what must not.", "boss": "Run the same prompt in the other tool and keep whichever deck is honestly better. Be ready to say why when the room asks."}, {"app": "Claude", "sec": "Capstone &middot; D3", "mins": "~25 min", "title": "D3.5 &middot; Deliverable 3. Charts that argue", "scenario": "Two or three charts that carry the argument, each with one written insight underneath. Not decoration. Evidence.", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "Same conversation."}], "goal": "Two or three charts, each defending exactly one claim in your briefing, each with a verified number and a one line insight. Plus the chart that argues against you.", "steps": ["Decide the two or three claims your initiative stands on. Each gets exactly one chart.", "Build them. One claim, a caption that states the claim, and a source line.", "Ask Claude to list the exact rows behind every chart, then spot check two by hand.", "Build the counter chart, the one view that argues against your recommendation."], "promptSteps": [{"label": "Step 1 &middot; The charts", "goal": "Charts that each make one point, with the point written underneath rather than left for the reader to guess.", "prompt": "Build [TWO or THREE] charts from our corrected figures, one for each of these claims: [YOUR CLAIMS]. For each chart give me a caption that states the single claim the chart makes, and a source line naming the file and any correction I applied. No decoration, no second y axis, no chart that does not defend a claim.", "findings": [{"label": "Chart one, in one sentence", "hint": "the claim it makes"}, {"label": "Chart two, in one sentence", "hint": "the claim it makes"}]}, {"label": "Step 2 &middot; Cite the rows", "goal": "The single most useful verification habit of the three days. Do it here and then keep doing it at work.", "prompt": "List the exact rows from the source file behind every number in every chart. Give me the row identifiers, not a description.", "findings": [{"label": "Which two did you spot check?", "hint": "and did they hold"}, {"label": "Your counter chart", "hint": "what does it show that hurts your case"}]}], "expect": "Two or three charts, each defending one claim, each with a verified number and a one line insight. If a chart defends nothing, it goes.", "stretch": "Put the counter chart in the deck rather than hiding it, and address it in the pitch before the room finds it. It reads as confidence, not weakness.", "boss": "Find a number in your own charts that you cannot fully trace back to a row. Then either fix it or cut it."}, {"app": "Claude", "sec": "Capstone &middot; D4", "mins": "~15 min", "title": "D3.6 &middot; Deliverable 4. Communication pack", "scenario": "The initiative is decided. Now it has to land with the people it affects. Pick the two items that fit your audience, then bank three reusable templates.", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "Same conversation, so the facts already agree."}], "goal": "Two finished communication items that agree with the briefing on every fact, plus three templates ready for the prompt library you started yesterday.", "steps": ["Choose TWO: an internal email to staff, a public FAQ, or a one page fact sheet.", "Draft them from the briefing, so the facts already agree.", "Write three reusable prompt templates with placeholders.", "The verifier checks the comms against the briefing, line by line."], "promptSteps": [{"label": "Step 1 &middot; The two items", "goal": "Communication that says the same thing as the briefing, in the language of the people it lands on.", "prompt": "From the briefing, draft [ITEM 1] and [ITEM 2] for [AUDIENCE]. Keep every fact identical to the briefing. Say what is happening, when, what it means for the reader, and what they need to do. Apologise once at most. Do not promise a date the data does not support.", "findings": [{"label": "Which two items, and for whom", "hint": "be specific about the audience"}, {"label": "Verifier: any fact that disagreed with the briefing?", "hint": "which one"}]}, {"label": "Step 2 &middot; Three templates", "goal": "The part that outlives today. Written so somebody who was not here can rerun this next quarter.", "prompt": "Now write three reusable prompt templates from this capstone, one per stage: profiling the data, doing the analysis, and writing the briefing. Use [PLACEHOLDERS] for anything that changes. Add a one line note under each saying what to check in the output before trusting it.", "findings": [{"label": "Your three templates", "hint": "names only"}, {"label": "Where did you save them?", "hint": "be specific, you will want them next week"}]}], "expect": "Two finished communication items that agree with the briefing on every fact, plus three templates in your library.", "stretch": "Take one item and produce it in three lengths: a full email, a poster, and an SMS. Same facts, three formats. That is one more library entry, not three.", "boss": "Draft the answer to the most hostile question your audience could ask, and put it in the FAQ before anybody has to ask it out loud."}, {"app": "In the room", "sec": "Present", "mins": "~20 min", "title": "D3.7 &middot; Assemble, rehearse, present", "scenario": "Assemble the package, run the pitch once out loud, cut what does not earn its place. Six minutes per pair, then one question from the room.", "goal": "A six minute pitch you have actually run once, a package that tells one consistent story, and a ready answer for the obvious challenge.", "steps": ["Assemble: briefing, then deck with the charts in it, then the comms items. One package, one story.", "Run the pitch once out loud. Cut whatever does not earn its place.", "Present. Decision first, and both of you speak.", "When the question comes, <b>show where the number came from</b>. That is the whole test."], "findings": [{"label": "Who presents which section", "hint": "agree it before you stand up"}, {"label": "Your answer to “how do you know?”", "hint": "the file, and the rows"}, {"label": "The question you could not answer", "hint": "write it down, it is the most useful thing today"}, {"label": "One thing you will steal from another pair", "hint": "be specific"}], "expect": "A six minute pitch you have run at least once, and a package where the briefing, the deck and the comms all say the same thing.", "stretch": "Prepare the three minute emergency version. Schedules slip, and the pairs who can compress still land their recommendation.", "boss": "Trade packages with another pair for two minutes and find one number in theirs to challenge in the questions. Expect them to do the same to you."}, {"app": "Assessment", "sec": "Close", "mins": "~10 min", "title": "D3.8 &middot; Quiz, test and survey", "scenario": "Three short things, in this order. The quiz is a warm up. The MAP test is the same one you took on Tuesday morning. The survey is how the next version of this programme gets better.", "goal": "All three done before 14:00, and one honest sentence in the survey that would be uncomfortable to say out loud.", "steps": ["<b>13:50</b> Quiz. The instructor gives you the link.", "<b>13:53</b> Post-program MAP test. Word for word the test from Tuesday morning.", "<b>13:56</b> End of program survey. Five minutes, and please be blunt.", "<b>13:58</b> Certificates and a photograph."], "findings": [{"label": "Quiz score", "hint": "for your own reference"}, {"label": "The topic you scored lowest on", "hint": "that is your revision list"}, {"label": "One thing you would change about this programme", "hint": "put this in the survey too"}], "expect": "Quiz done, test submitted, survey submitted. Then a certificate and a photograph.", "stretch": "Look at the topics you got wrong and go back to the relevant day page. All three stay online after today.", "boss": "Write down the one question you were least sure about, then go and find the answer yourself rather than asking."}];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function datasetBlock(d){
  return '<div class="dataset"><div class="ds-k">Attached data</div>'
    +'<div class="ds-note">'+d.note+'</div>'
    +'<a class="dl" href="'+d.href+'" download><span class="ic">\u2b07</span>'
    +'<span>Download<small>'+esc(d.label)+'</small></span></a>'
    +(d.head?'<div class="ds-table-wrap"><table class="ds-table"><thead><tr>'
      +d.head.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'
      +d.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')
      +'</tbody></table><div class="ds-more">'+esc(d.more||'')+'</div></div>':'')
    +'</div>';
}
function launchBlock(ls){
  return '<div class="launches">'+ls.map(function(l){
    return '<a class="launch" href="'+l.href+'" target="_blank" rel="noopener">'
      +'<span class="ln">'+esc(l.label)+' \u2197</span>'
      +(l.note?'<span class="lnn">'+esc(l.note)+'</span>':'')+'</a>'}).join('')+'</div>';
}
function goalBlock(g){return '<div class="goal"><div class="gk">What you are aiming for</div><p>'+g+'</p></div>'}
function findVal(k){return (state[cur]&&state[cur].findings&&state[cur].findings[k])||''}
function findingsBlock(list,prefix){
  return '<div class="findings">'+list.map(function(f,i){
    var k=prefix+':'+i, v=findVal(k);
    return '<label class="find"><span>'+esc(f.label)+'</span>'
      +'<input class="find-in'+(v?' filled':'')+'" data-fk="'+k+'" value="'+esc(v)+'" placeholder="'+esc(f.hint||'')+'"></label>';
  }).join('')+'</div>';
}
function promptStepsBlock(steps){
  return steps.map(function(s,i){
    return '<div class="pstep"><div class="psk">'+s.label+'</div><p class="psg">'+s.goal+'</p>'
      +(s.prompt?'<div class="prompt st-prompt" data-p="'+s.prompt.replace(/"/g,'&quot;')+'">'
        +'<span class="copy-tag">tap to copy</span>'+s.prompt+'</div>':'')
      +(s.findings?findingsBlock(s.findings,'ps'+i):'')
      +'</div>';
  }).join('');
}
function bindFindings(v){
  v.querySelectorAll('.find-in').forEach(function(inp){
    inp.oninput=function(){
      state[cur]=state[cur]||{}; state[cur].findings=state[cur].findings||{};
      state[cur].findings[inp.dataset.fk]=inp.value; save();
      inp.classList.toggle('filled',!!inp.value);
    };
  });
}

const KEY='aiet_day3_lab';
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}
let cur=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const navList=document.getElementById('navList');
function buildNav(){
  navList.innerHTML='';let lastSec=null;
  TASKS.forEach((t,i)=>{
    if(t.sec!==lastSec){lastSec=t.sec;
      const h=document.createElement('div');h.className='nav-sec';h.innerHTML=t.sec;navList.appendChild(h);}
    const el=document.createElement('div');
    el.className='nav-item'+(i===cur?' active':'')+((state[i]&&state[i].done)?' done':'');
    el.innerHTML='<span class="ni-n">'+((state[i]&&state[i].done)?'✓':(i+1))+'</span><span class="ni-t">'+t.title+'</span>';
    el.onclick=()=>{cur=i;render();window.scrollTo(0,0)};
    navList.appendChild(el);
  });
}
function updateProg(){
  const done=Object.values(state).filter(x=>x&&x.done).length;
  document.getElementById('progFill').style.width=(done/TASKS.length*100)+'%';
  document.getElementById('progLabel').textContent=done+' of '+TASKS.length+' done';
}
function flash(el,tagSel){const tag=el.querySelector(tagSel);el.classList.add('copied');
  if(tag){const old=tag.textContent;tag.textContent='copied ✓';
    setTimeout(()=>{el.classList.remove('copied');tag.textContent=old},1500);}
  else setTimeout(()=>el.classList.remove('copied'),1200);}
function fallback(text,done){const ta=document.createElement('textarea');ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);}
function copy(text,el,tagSel){const done=()=>flash(el,tagSel);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  else fallback(text,done);}

function engineHTML(t){
  const e=t.engine;
  return '<div class="sc-k">Answer all '+e.items.length+'</div>'
   + e.items.map((it,i)=>'<div class="qi" data-i="'+i+'"><div class="qt">'+it.t+'</div><div class="qopts">'
      + e.opts.map(o=>'<button class="qopt" data-k="'+o[0]+'">'+o[1]+'</button>').join('')
      + '</div><div class="qwhy"><b>Why.</b> '+it.why+'</div></div>').join('')
   + '<div class="lw-row" style="margin-top:14px"><button class="lw-btn" id="engCheck">Check my answers</button>'
   + '<button class="lw-btn ghost" id="engReset">Start over</button></div>'
   + '<div class="verdict" id="engVerdict"></div>';
}
function bindEngine(t,v){
  const e=t.engine,pick={};
  v.querySelectorAll('.qi').forEach(q=>{
    const i=+q.dataset.i;
    q.querySelectorAll('.qopt').forEach(b=>{
      b.onclick=()=>{if(q.classList.contains('right'))return;
        q.querySelectorAll('.qopt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');pick[i]=b.dataset.k;};
    });
  });
  document.getElementById('engCheck').onclick=()=>{
    let all=true;
    v.querySelectorAll('.qi').forEach(q=>{
      const i=+q.dataset.i,want=e.items[i].k,got=pick[i];
      q.classList.remove('right','wrong');
      q.querySelectorAll('.qopt').forEach(x=>x.classList.remove('ok','no'));
      if(!got){all=false;return}
      if(got===want){q.classList.add('right');q.querySelector('.qwhy').classList.add('show');
        q.querySelector('.qopt[data-k="'+got+'"]').classList.add('ok');}
      else{all=false;q.classList.add('wrong');q.querySelector('.qopt[data-k="'+got+'"]').classList.add('no');}
    });
    const vd=document.getElementById('engVerdict');
    if(all){vd.className='verdict show good';vd.textContent='Six for six. Mark it done below.';}
    else{vd.className='verdict show bad';vd.textContent='Not yet. The wrong ones are marked in red. Fix them and check again.';}
  };
  document.getElementById('engReset').onclick=()=>{render()};
}

function render(){
  const t=TASKS[cur],st=state[cur]||{};
  document.getElementById('crumb').innerHTML='Task '+(cur+1)+' of '+TASKS.length+' · '+t.sec;
  location.hash='t'+(cur+1);
  const v=document.getElementById('view');
  v.innerHTML=
    '<div class="task-tag"><span class="app">'+t.app+'</span><span>Task '+(cur+1)+' of '+TASKS.length+'</span><span class="mins">'+t.mins+'</span></div>'
   +'<h1 class="task-h">'+t.title+'</h1>'
   +'<p class="scn">'+t.scenario+'</p>'
   +((t.widget&&t.widgetFirst)?'<div class="step-card"><div class="sc-k">'+(t.widgetLabel||'Choose one')+'</div>'+t.widget+'</div>':'')
   +(t.steps?'<div class="step-card"><div class="sc-k">Steps</div><ol>'+t.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'
      +(t.prompt?'<div class="prompt" id="promptBox"><span class="copy-tag">tap to copy</span>'+t.prompt+'</div>':'')
      +'</div>':'')
   +(t.asset?'<a class="lw-test" href="'+t.asset.href+'" download style="margin:0 0 20px">⬇ '+t.asset.label+'</a>':'')
   +(t.files?t.files.map(function(f){return datasetBlock({note:f.note||'',href:f.href,label:f.label})}).join(''):'')
   +(t.dataset?datasetBlock(t.dataset):'')
   +(t.launches?launchBlock(t.launches):'')
   +(t.goal?goalBlock(t.goal):'')
   +(t.promptSteps?promptStepsBlock(t.promptSteps):'')
   +(t.findings?'<div class="step-card"><div class="sc-k">Record what you found</div>'+findingsBlock(t.findings,'top')+'</div>':'')
   +(t.starterlist?'<div class="step-card"><div class="sc-k">Starter menu, tap any to copy</div>'
      +'<div class="lw-starters">'+t.starterlist.map(x=>'<div class="prompt st-prompt" data-p="'+x.replace(/"/g,'&quot;')+'"><span class="copy-tag">tap to copy</span>'+x+'</div>').join('')+'</div></div>':'')
   +(t.engine?'<div class="step-card">'+engineHTML(t)+'</div>':'')
   +((t.widget&&!t.widgetFirst)?'<div class="step-card"><div class="sc-k">Build and test</div>'+t.widget+'</div>':'')
   +'<div class="expect"><div class="ex-k">Done looks like</div><p>'+t.expect+'</p></div>'
   +(t.stretch?'<div class="step-card" style="border-left-color:var(--soft)"><div class="sc-k">Tier 2 · Stretch, finished early?</div><p style="font-size:15px;color:var(--ink2);line-height:1.55">'+t.stretch+'</p></div>':'')
   +(t.boss?'<div class="step-card" style="border-left-color:var(--gold)"><div class="sc-k" style="color:var(--gold-lt)">Tier 3 · Boss challenge</div><p style="font-size:15px;color:var(--ink2);line-height:1.55">'+t.boss+'</p></div>':'')
   +'<div class="capture"><label>Paste your Claude result, or a note on how it went</label>'
   +'<textarea id="note" placeholder="Optional. Saves to this browser so you can review it later.">'+(st.note||'')+'</textarea>'
   +'<div class="cap-row"><button class="cap-btn" id="markDone">'+(st.done?'Saved ✓':'Mark done')+'</button>'
   +'<span class="cap-done '+(st.done?'on':'')+'" id="capDone">✓ Captured</span></div></div>'
   +'<div class="task-foot"><button class="tf-btn" id="tfPrev"'+(cur===0?' disabled':'')+'>‹ Previous</button>'
   +'<button class="tf-btn next" id="tfNext"'+(cur===TASKS.length-1?' disabled':'')+'>Next task ›</button></div>';

  const pb=document.getElementById('promptBox');
  if(pb)pb.onclick=()=>copy(t.prompt,pb,'.copy-tag');
  v.querySelectorAll('.st-prompt').forEach(sp=>sp.onclick=()=>copy(sp.dataset.p,sp,'.copy-tag'));
  v.querySelectorAll('.lw-pre.copyable').forEach(p=>p.onclick=()=>copy(p.innerText,p,'.nope'));

  if(v.querySelector('.lw-tabs')){
    const tabs=v.querySelectorAll('.lw-tab');
    tabs.forEach(tb=>tb.onclick=()=>{const sc=tb.dataset.sc;
      tabs.forEach(x=>x.classList.toggle('on',x===tb));
      v.querySelectorAll('.lw-doc [data-sc], .lw-job [data-sc], .lw-briefs [data-sc]').forEach(el=>{el.hidden=el.dataset.sc!==sc});
    });
  }
  if(document.getElementById('lwBuild')){
    const gg=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
    document.getElementById('lwBuild').onclick=()=>{
      document.getElementById('lwOut').value=[gg('lwR'),gg('lwC'),gg('lwT'),gg('lwF'),gg('lwTo'),gg('lwX')].filter(Boolean).join('\n\n')};
    document.getElementById('lwCopy').onclick=()=>{const o=document.getElementById('lwOut').value.trim();if(!o)return;
      const h=document.getElementById('lwCopyHint');
      const ok=()=>{h.textContent='copied ✓';setTimeout(()=>h.textContent='',1500)};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(o).then(ok).catch(()=>fallback(o,ok));
      else fallback(o,ok);};
  }
  if(t.engine)bindEngine(t,v);
  bindFindings(v);

  document.getElementById('markDone').onclick=()=>{
    const note=document.getElementById('note').value;
    state[cur]={done:true,note};save();
    document.getElementById('capDone').classList.add('on');
    document.getElementById('markDone').textContent='Saved ✓';buildNav();updateProg();};
  document.getElementById('note').oninput=e=>{state[cur]=state[cur]||{};state[cur].note=e.target.value;save()};
  const p=document.getElementById('tfPrev'),n=document.getElementById('tfNext');
  if(p)p.onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0)}};
  if(n)n.onclick=()=>{if(cur<TASKS.length-1){cur++;render();window.scrollTo(0,0)}};
  buildNav();updateProg();
}
document.getElementById('mPrev').onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0)}};
document.getElementById('mNext').onclick=()=>{if(cur<TASKS.length-1){cur++;render();window.scrollTo(0,0)}};
document.getElementById('ham').onclick=()=>document.getElementById('rail').classList.toggle('open');
document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all your captured notes for Day 1?')){state={};save();cur=0;render()}};
(function(){const m=(location.hash||'').match(/#t(\d+)/);if(m){const n=+m[1]-1;if(n>=0&&n<TASKS.length)cur=n;}})();
window.addEventListener('hashchange',()=>{const m=(location.hash||'').match(/#t(\d+)/);
  if(m){const n=+m[1]-1;if(n>=0&&n<TASKS.length&&n!==cur){cur=n;render();window.scrollTo(0,0)}}});
render();
</script>
</body>
</html>
